<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScribeSync</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

    <div id="toolbar">
        <div class="tool-group">
            <button id="export-btn" class="btn">🖨️ Export PDF</button>
            <span id="current-notebook-name" style="margin-left:10px; font-weight:bold; color:#2196f3; font-size: 13px;">No Project</span>
        </div>

        <div class="tool-group" style="margin-left: auto; padding-left: 15px; border-left: 2px solid #ccc;">
            <button id="select-btn" class="btn tool-btn" style="padding: 8px;">🖱️ Select</button>
            <button id="delete-selected-btn" class="btn tool-btn danger-btn" style="padding: 8px;">🗑️ Delete</button>
            <button id="pen-btn" class="btn tool-btn active" style="padding: 8px;">🖊️ Pen</button>
            <input type="color" id="pen-color" value="#006eff">
            <button id="eraser-btn" class="btn tool-btn" style="padding: 8px;">🧽 Eraser</button>
            <button id="eraser-mode-btn" class="btn" style="padding: 5px 8px; font-size: 12px; display:none;">Delete</button>
            <label style="margin-left: 5px;">Size: <span id="brush-size-val">3</span></label>
            <input type="range" id="brush-size" min="1" max="50" value="3" style="width: 70px;">
        </div>

        <div class="tool-group" style="padding-left: 15px; border-left: 2px solid #ccc;">
            <label>Zoom:</label>
            <input type="range" id="zoom-slider" min="30" max="300" value="100" style="width: 80px;">
            <span id="zoom-display" style="font-weight:bold; font-size: 13px; width: 45px; text-align: right;">100%</span>
        </div>

        <div id="pagination-controls" class="tool-group" style="padding-left: 15px; border-left: 2px solid #ccc; display: none;">
            <button id="prev-page-btn" class="btn" style="padding: 5px 10px;">◀</button>
            <span id="page-display" style="font-weight:bold; font-size: 13px; width: 65px; text-align: center;">Page 1/1</span>
            <button id="next-page-btn" class="btn" style="padding: 5px 10px;">▶</button>
            <button id="add-page-btn" class="btn" style="padding: 5px 10px; color: #2196f3; font-weight: bold;">➕ New</button>
        </div>

        <div class="tool-group" style="padding-left: 15px; border-left: 2px solid #ccc;">
            <label>Paper:</label>
            <select id="page-size">
                <option value="infinite">Infinite Scroll</option>
                <option value="a4">A4 Page</option>
            </select>
            <select id="bg-color">
                <option value="white">Light</option>
                <option value="black">Dark</option>
            </select>
        </div>

        <div class="tool-group" style="padding-left: 15px; border-left: 2px solid #ccc;">
            <button id="mode-toggle" class="btn">💻 Laptop Mode</button>
            <button id="share-btn" class="btn" style="background:#e8f5e9; border-color:#81c784; color:#2e7d32;">📱 iPad</button>
            <button id="clear-btn" class="btn clear-btn">🗑️ Clear</button>
        </div>
        <div class="tool-group" style="padding-left: 15px; border-left: 2px solid #ccc;">
            <div id="typing-toolbar" style="display: none; align-items: center; gap:6px;">
                <button id="undo-btn" class="btn" title="Undo">↶</button>
                <button id="redo-btn" class="btn" title="Redo">↷</button>
                <button id="bold-btn" class="btn" title="Bold">B</button>
                <button id="italic-btn" class="btn" title="Italic">I</button>
                <button id="underline-btn" class="btn" title="Underline">U</button>
                <select id="font-select" class="btn">
                    <option value="Arial">Arial</option>
                    <option value="Georgia">Georgia</option>
                    <option value="Times New Roman">Times</option>
                    <option value="Courier New">Courier</option>
                </select>
                <select id="font-size-select" class="btn">
                    <option value="3">Small</option>
                    <option value="4" selected>Normal</option>
                    <option value="5">Large</option>
                    <option value="6">XL</option>
                </select>
                <input type="color" id="font-color" value="#000000" title="Font color" style="width:38px; height:30px; padding:3px;">
                <button id="align-left-btn" class="btn" title="Align left">⟵</button>
                <button id="align-center-btn" class="btn" title="Center">⮜ ⮞</button>
                <button id="align-right-btn" class="btn" title="Align right">⟶</button>
                <button id="align-justify-btn" class="btn" title="Justify">≡</button>
                <button id="olist-btn" class="btn" title="Ordered list">1.</button>
                <button id="ulist-btn" class="btn" title="Unordered list">•</button>
                <button id="clear-format-btn" class="btn" title="Clear formatting">Tx</button>
            </div>
        </div>
    </div>

    <div id="notebook-container">
        <div id="scroll-wrapper">
            <div id="text-layer" contenteditable="true" data-placeholder="Click here to type, or use the pen to draw..."></div>
            <canvas id="ink-layer"></canvas>
        </div>
    </div>

    <div id="qr-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Connect your iPad</h3>
            <p>Scan this code with your iPad camera:</p>
            <div id="qrcode"></div>
            <input type="text" id="local-url-input" readonly>
            <button id="copy-url-btn" class="btn" style="margin-top: 10px; width: 100%;">📋 Copy Link</button>
            <button id="close-modal-btn" class="btn clear-btn" style="margin-top: 10px; width: 100%;">Close</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
